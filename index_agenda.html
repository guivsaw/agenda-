  const ev = eventos[key];
  const parts = [];
  if (fer) parts.push(`Feriado — ${fer}`);
  else if (isMondayFeriadoBridge(key)) {
    const dow = fromKey(key).getDay();
    const monKey = toKey(addDays(fromKey(key), dow === 5 ? 3 : dow === 6 ? 2 : 1));
    parts.push(`Ponte — feriado ${feriados[monKey]} na segunda`);
  }
  if (ev) parts.push(ev);
  if (extra) parts.push(extra);
  if (key in colorOverrides) parts.push(colorOverrides[key] === "none" ? "cor manual: em aberto" : "cor definida manualmente");
  return parts.join(" · ");
}
function rowContent(key, { isFridaySlot=false } = {}){
  if (eventos[key]) return eventos[key];
  if (feriados[key]) return `Feriado — ${feriados[key]}`;
  if (isFridaySlot) return cityFor(key);
  return "Ambu Prevent";
}
function buildRows(year, monthIdx){
  const monthKey = `${year}-${pad(monthIdx+1)}`;
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  const rows = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${year}-${pad(monthIdx+1)}-${pad(day)}`;
    const dow = fromKey(key).getDay();
    if (dow === 5) {
      if (feriados[key]) {
        const thuKey = toKey(addDays(fromKey(key), -1));
        if (thuKey.startsWith(monthKey)) rows.push({ date: thuKey, content: rowContent(thuKey), kind: "evento" });
      } else {
        rows.push({ date: key, content: rowContent(key, { isFridaySlot: true }), kind: "evento" });
      }
    }
    if (feriados[key]) rows.push({ date: key, content: `Feriado — ${feriados[key]}`, isFeriado: true, kind: "feriado" });
  }
  Object.keys(extras).forEach(k => {
    if (k.startsWith(monthKey)) rows.push({ date: k, content: extras[k], kind: "extra" });
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return rows;
}

function renderRowHTML(row){
  const dow = DOW_ABBR[fromKey(row.date).getDay()];
  const key = `${row.kind}-${row.date}`;
  return `<div class="line-row" data-key="${key}" data-date="${row.date}" data-kind="${row.kind}">
      <span class="line-dow">${dow}</span>
      <span class="line-date">${fmtDM(row.date)}</span>
      <span class="line-content${row.isFeriado ? " is-feriado" : ""}">${esc(row.content)}</span>
      <button class="line-edit" type="button" title="editar">✎</button>
    </div>`;
}
function renderLinesHTML(year, monthIdx){
  return buildRows(year, monthIdx).map(renderRowHTML).join("");
}
function renderCellHTML(key){
  const cat = classify(key);
  const tip = tipFor(key);
  const fer = feriados[key];
  const day = fromKey(key).getDate();
  const classes = ["cell"];
  if (cat) classes.push("fill", cat);
  if (fer) classes.push("holiday");
  if (tip) classes.push("has-tip");
  if (key === todayKey) classes.push("today");
  return `<div class="${classes.join(" ")}" data-key="${key}"${tip ? ` data-tip="${escAttr(tip)}"` : ""}><div class="num-badge">${day}</div></div>`;
}
function renderGridHTML(year, monthIdx){
  let html = "";
  DOW.forEach(d => { html += `<div class="dow">${d}</div>`; });
  const firstDay = new Date(year, monthIdx, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  for (let i = 0; i < startOffset; i++) html += `<div class="cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) html += renderCellHTML(`${year}-${pad(monthIdx+1)}-${pad(day)}`);
  return html;
}
function renderMonthHTML(year, monthIdx, title){
  const monthKey = `${year}-${pad(monthIdx+1)}`;
  return `
  <div class="month-block" id="m-${monthKey}">
    <div class="month-header">
      <div class="month-title">${title}</div>
      <div class="month-toggles">
        <button class="chip-toggle" type="button" data-section="cal">Calendário</button>
        <button class="chip-toggle" type="button" data-section="list">Lista</button>
      </div>
    </div>
    <div class="grid cal-section" data-month="${monthKey}">${renderGridHTML(year, monthIdx)}</div>
    <div class="list-section" data-month="${monthKey}">
      <div class="lines" id="lines-${monthKey}">${renderLinesHTML(year, monthIdx)}</div>
      <button class="add-btn" type="button" data-month="${monthKey}">+ adicionar data e evento</button>
      <div class="add-form" data-month="${monthKey}">
        <input type="date" class="add-date" min="${monthKey}-01" max="${monthKey}-31">
        <input type="text" class="add-text" placeholder="evento">
        <button class="ok" type="button">OK</button>
        <button class="cancel" type="button">Cancelar</button>
      </div>
      <div class="freeform-label">Notas livres</div>
      <textarea class="freeform" data-month="${monthKey}" placeholder="Escreva aqui — quantas linhas quiser...">${esc(notes[monthKey] || "")}</textarea>
    </div>
  </div>`;
}
const LEGEND = [
  ["cat-arapoti", "Arapoti (seg/sex) e terça Metrop"],
  ["cat-weekend-arapoti", "Fim de semana inteiro em Arapoti"],
  ["cat-livre", "Feriado / folga — livre"],
  ["cat-prevent", "Terça Prevent"],
  ["cat-sp", "Fim de semana em SP"],
];
function renderShell(){
  document.getElementById("monthNav").innerHTML = MONTHS.map(([year, monthIdx, title, short]) => `<a href="#m-${year}-${pad(monthIdx+1)}">${short}</a>`).join("");
  let legendHTML = LEGEND.map(([cls,label]) => `<div class="legend-item"><span class="swatch" style="background:var(--${cls.replace('cat-','c-')})"></span>${label}</div>`).join("");
  legendHTML += `<div class="legend-item"><span class="swatch ring-demo"></span>Feriado nacional / SP (número com contorno)</div>`;
  document.getElementById("legend").innerHTML = legendHTML;
  document.getElementById("calendar").innerHTML = MONTHS.map(([y,m,t]) => renderMonthHTML(y,m,t)).join("");
  wireCalendar();
}

// ================= SUPABASE (ler/gravar o estado compartilhado) =================
const banner = document.getElementById("statusBanner");
function setBanner(cls, text){ banner.className = "status-banner show " + cls; banner.textContent = text; }
function clearBanner(){ banner.className = "status-banner"; banner.textContent = ""; }

async function loadState(){
  try {
    const res = await fetch(REST + "?id=eq.1&select=data,updated_at", { headers: SB_HEADERS });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (rows && rows[0] && rows[0].data) {
      const d = rows[0].data;
      feriados = d.feriados || feriados;
      eventos = d.eventos || eventos;
      extras = d.extras || extras;
      colorOverrides = d.colorOverrides || colorOverrides;
      notes = d.notes || notes;
      lastKnownUpdatedAt = rows[0].updated_at;
    }
    clearBanner();
  } catch (e) {
    setBanner("error", "Não consegui carregar do servidor agora — mostrando a última cópia conhecida. Recarregue a página em instantes.");
  }
}

let saving = false, pendingSave = false, saveTimer = null;
async function saveStateNow(){
  if (saving) { pendingSave = true; return; }
  saving = true;
  setBanner("saving", "Salvando…");
  try {
    const body = JSON.stringify({ data: { feriados, eventos, extras, colorOverrides, notes }, updated_at: new Date().toISOString() });
    const res = await fetch(REST + "?id=eq.1", {
      method: "PATCH",
      headers: Object.assign({}, SB_HEADERS, { "Content-Type": "application/json", Prefer: "return=minimal" }),
      body,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    clearBanner();
  } catch (e) {
    setBanner("error", "Não deu pra salvar agora. Suas edições continuam nesta tela — tente de novo em instantes.");
  } finally {
    saving = false;
    if (pendingSave) { pendingSave = false; saveStateNow(); }
  }
}
function saveState(){ saveStateNow(); }

// ================= INTERAÇÃO =================
const today = new Date();
const todayKey = toKey(today);
let editingSomething = false;

function wireLineRows(scope){
  scope.querySelectorAll(".line-row").forEach(el => {
    const btn = el.querySelector(".line-edit");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const row = { date: el.dataset.date, kind: el.dataset.kind, isFeriado: el.dataset.kind === "feriado" };
      const contentEl = el.querySelector(".line-content");
      row.content = contentEl ? contentEl.textContent.replace(/^Feriado — /, "") : "";
      paintRowEdit(el, row);
    });
  });
}
function monthOf(key){ const [y,m] = key.split("-").map(Number); return [y, m-1]; }
function paintRowEdit(el, row){
  editingSomething = true;
  const dateEditable = row.kind !== "evento";
  const rawText = row.kind === "feriado" ? feriados[row.date] : (row.content !== undefined ? row.content : "");
  const canDelete = row.kind === "feriado" || row.kind === "extra" || (row.kind === "evento" && eventos[row.date]);
  el.className = "line-row line-row-edit";
  el.innerHTML = `
    <div class="edit-fields">
      ${dateEditable
        ? `<input type="date" class="edit-date" value="${row.date}">`
        : `<span class="line-date">${fmtDM(row.date)}</span>`}
      <input type="text" class="edit-text" value="${escAttr(rawText)}">
    </div>
    <div class="edit-actions">
      <button class="ok" type="button">Salvar</button>
      ${canDelete ? `<button class="del" type="button">Apagar</button>` : ""}
      <button class="cancel" type="button">Cancelar</button>
    </div>
  `;
  el.querySelector(".cancel").addEventListener("click", () => { editingSomething = false; renderLinesInto(...monthOf(row.date)); });
  el.querySelector(".ok").addEventListener("click", () => {
    const newDate = dateEditable ? el.querySelector(".edit-date").value : row.date;
    const newText = el.querySelector(".edit-text").value.trim();
    if (!newDate || !newText) return;
    editingSomething = false;
    saveRowEdit(row, newDate, newText);
  });
  const delBtn = el.querySelector(".del");
  if (delBtn) delBtn.addEventListener("click", () => { editingSomething = false; deleteRow(row); });
}
function renderLinesInto(year, monthIdx){
  const monthKey = `${year}-${pad(monthIdx+1)}`;
  const linesEl = document.getElementById(`lines-${monthKey}`);
  if (!linesEl) return;
  linesEl.innerHTML = renderLinesHTML(year, monthIdx);
  wireLineRows(linesEl);
}
function afterDataChange(oldKey, newKey){
  const months = new Set([monthKeyOf(oldKey), monthKeyOf(newKey)]);
  months.forEach(mk => {
    if (mk < RANGE_START.slice(0,7) || mk > RANGE_END.slice(0,7)) return;
    const [y, m] = mk.split("-").map(Number);
    renderLinesInto(y, m-1);
  });
  [oldKey, newKey].forEach(k => {
    if (!inRange(k)) return;
    const cell = document.querySelector(`.cell[data-key="${k}"]`);
    if (!cell) return;
    cell.outerHTML = renderCellHTML(k);
  });
  document.querySelectorAll(".cell[data-key]").forEach(wireCell);
  saveState();
}
function saveRowEdit(row, newDate, newText){
  const oldDate = row.date;
  if (row.kind === "feriado") {
    if (newDate !== oldDate) delete feriados[oldDate];
    feriados[newDate] = newText;
  } else if (row.kind === "extra") {
    if (newDate !== oldDate) delete extras[oldDate];
    extras[newDate] = newText;
  } else {
    eventos[oldDate] = newText;
  }
  afterDataChange(oldDate, newDate);
}
function deleteRow(row){
  if (row.kind === "feriado") delete feriados[row.date];
  else if (row.kind === "extra") delete extras[row.date];
  else delete eventos[row.date];
  afterDataChange(row.date, row.date);
}

const tipEl = document.getElementById("tip");
function showTip(target, text){
  if (!text) return;
  tipEl.textContent = text;
  const r = target.getBoundingClientRect();
  tipEl.style.left = Math.min(window.innerWidth - 230, Math.max(8, r.left)) + "px";
  const top = r.top - 8;
  if (top < 60) { tipEl.style.top = (r.bottom + 8) + "px"; tipEl.style.transform = ""; }
  else { tipEl.style.top = (r.top - 8) + "px"; tipEl.style.transform = "translateY(-100%)"; }
  tipEl.classList.add("show");
}
function hideTip(){ tipEl.classList.remove("show"); tipEl.style.transform = ""; }
document.addEventListener("click", (e) => {
  if (!e.target.closest(".has-tip") && !e.target.closest(".cp")) hideTip();
});

const cpEl = document.getElementById("colorPicker");
const COLOR_OPTIONS = [
  { cls: "cat-arapoti", label: "Arapoti / Metrop" },
  { cls: "cat-weekend-arapoti", label: "Fds Arapoti" },
  { cls: "cat-livre", label: "Livre" },
  { cls: "cat-prevent", label: "Prevent" },
  { cls: "cat-sp", label: "Fds SP" },
];
function closeColorPicker(){ cpEl.classList.remove("show"); editingSomething = false; }
function openColorPicker(cell, key){
  editingSomething = true;
  hideTip();
  const info = cell.dataset.tip ? `${fmtDM(key)} — ${cell.dataset.tip}` : fmtDM(key);
  const current = key in colorOverrides ? colorOverrides[key] : null;
  const rows = [
    ...COLOR_OPTIONS.map(c => ({ cls: c.cls, label: c.label, dot: `<span class="cp-dot" style="background:var(--${c.cls.replace('cat-','c-')})"></span>` })),
    { sep: true },
    { cls: "", label: "Automático (deixa a regra decidir)", dot: `<span class="cp-dot none"></span>` },
    { cls: "none", label: "Forçar sem cor (em branco)", dot: `<span class="cp-dot blank"></span>` },
  ];
  cpEl.innerHTML = `
    <div class="cp-label">${esc(info)}</div>
    ${rows.map(r => r.sep
      ? `<div class="cp-sep"></div>`
      : `<button class="cp-row${current===(r.cls||null)?" selected":""}" type="button" data-cls="${r.cls}">${r.dot}<span>${r.label}</span></button>`
    ).join("")}
  `;
  cpEl.querySelectorAll(".cp-row").forEach(btn => {
    btn.addEventListener("click", () => {
      const cls = btn.dataset.cls;
      if (cls === "") delete colorOverrides[key]; else colorOverrides[key] = cls;
      closeColorPicker();
      afterDataChange(key, key);
    });
  });
  const r = cell.getBoundingClientRect();
  cpEl.style.left = Math.min(window.innerWidth - 212, Math.max(8, r.left)) + "px";
  const spaceAbove = r.top, spaceBelow = window.innerHeight - r.bottom;
  if (spaceBelow > 260 || spaceBelow > spaceAbove) {
    cpEl.style.top = (r.bottom + 6) + "px"; cpEl.style.transform = "";
  } else {
    cpEl.style.top = Math.max(8, r.top - 6) + "px"; cpEl.style.transform = "translateY(-100%)";
  }
  cpEl.classList.add("show");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".cp") && !e.target.closest(".cell")) closeColorPicker();
});

function wireCell(cell){
  const key = cell.dataset.key;
  cell.addEventListener("mouseenter", () => { if (cell.dataset.tip) showTip(cell, `${fmtDM(key)} — ${cell.dataset.tip}`); });
  cell.addEventListener("mouseleave", hideTip);
  cell.addEventListener("click", () => openColorPicker(cell, key));
}
function wireCalendar(){
  document.querySelectorAll(".cell[data-key]").forEach(wireCell);
  document.querySelectorAll(".lines").forEach(wireLineRows);

  document.querySelectorAll(".month-block").forEach(block => {
    block.querySelectorAll(".chip-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const sec = btn.dataset.section;
        const target = block.querySelector(`.${sec}-section`);
        const hidden = target.style.display === "none";
        target.style.display = hidden ? "" : "none";
        btn.classList.toggle("off", !hidden);
      });
    });
    const addBtn = block.querySelector(".add-btn");
    const addForm = block.querySelector(".add-form");
    addBtn.addEventListener("click", () => { addForm.classList.toggle("open"); editingSomething = addForm.classList.contains("open"); });
    addForm.querySelector(".cancel").addEventListener("click", () => { addForm.classList.remove("open"); editingSomething = false; });
    addForm.querySelector(".ok").addEventListener("click", () => {
      const dateVal = addForm.querySelector(".add-date").value;
      const textVal = addForm.querySelector(".add-text").value.trim();
      if (!dateVal || !textVal) return;
      extras[dateVal] = textVal;
      addForm.querySelector(".add-text").value = "";
      addForm.querySelector(".add-date").value = "";
      addForm.classList.remove("open");
      editingSomething = false;
      afterDataChange(dateVal, dateVal);
    });
  });

  document.querySelectorAll(".freeform").forEach(ta => {
    ta.dataset.orig = ta.value;
    ta.addEventListener("focus", () => { editingSomething = true; });
    ta.addEventListener("blur", () => {
      editingSomething = false;
      if (ta.value !== ta.dataset.orig) {
        notes[ta.dataset.month] = ta.value;
        ta.dataset.orig = ta.value;
        saveState();
      }
    });
  });
}

document.getElementById("viewSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  document.querySelectorAll("#viewSwitch button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const mode = btn.dataset.mode;
  document.querySelectorAll(".month-block").forEach(mb => {
    const cal = mb.querySelector(".cal-section"), list = mb.querySelector(".list-section");
    cal.style.display = (mode === "list") ? "none" : "";
    list.style.display = (mode === "cal") ? "none" : "";
    mb.querySelectorAll(".chip-toggle").forEach(b => b.classList.remove("off"));
  });
});

document.getElementById("saveBtn").addEventListener("click", () => {
  document.querySelectorAll(".freeform").forEach(ta => { notes[ta.dataset.month] = ta.value; });
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "agenda_calendario_backup.html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

// ================= BOOT =================
(async () => {
  setBanner("saving", "Carregando…");
  await loadState();
  renderShell();
  clearBanner();
})();

// checa por atualizações de outros dispositivos a cada 15s (só aplica se você não estiver editando algo agora)
setInterval(async () => {
  if (editingSomething) return;
  const prevUpdatedAt = lastKnownUpdatedAt;
  await loadState();
  if (lastKnownUpdatedAt && lastKnownUpdatedAt !== prevUpdatedAt) {
    renderShell();
  }
}, 15000);
</script>
